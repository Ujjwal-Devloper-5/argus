# ARGUS - Main Configuration

cameras:
  - name: front_door
    rtsp_url: ${CAMERA_1_RTSP_URL}
    rtsp_sub_url: ${CAMERA_1_RTSP_SUB_URL}
    resolution: [1920, 1080]
    fps: 15
    # How many seconds to keep in memory before an event triggers
    pre_buffer_seconds: 5
    # How many seconds to record after motion/person leaves
    post_event_seconds: 30
    zones:
      # Optional: define polygon zones where detection is active
      # - [[0, 0], [1920, 0], [1920, 1080], [0, 1080]]
    disabled: false

detection:
  # model: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  model: ${DETECTION_MODEL:yolov8n}
  confidence: 0.60
  # Filter detections to only these classes (e.g., person, car, dog, cat)
  classes:
    - person
  
recognition:
  similarity_threshold: 0.60
  auto_learn:
    enabled: true
    appearances_before_prompt: 5
    prompt_via: telegram  # telegram, discord, or both

intelligence:
  enabled: true
  provider: ${LLM_PROVIDER:ollama}
  prompt: >
    Describe what this person is doing in one sentence.
    Are they behaving suspiciously? Be concise.
  # If true, only trigger alerts if LLM flags behavior as suspicious
  filter_by_suspicion: false

alerts:
  # Minimum seconds between alerts for the same camera
  cooldown_seconds: 60

  # Alert routing: "telegram", "discord", or "both"
  routing: both

  # Rate limit: Maximum messages dispatched per second across all platforms
  max_rate_per_second: 30.0

  quiet_hours:
    enabled: false
    start: "23:00"
    end: "07:00"
    # Even in quiet hours, alert immediately if LLM flags as suspicious
    override_on_suspicious: true
    # Policy for non-critical alerts during quiet hours:
    # "hold" (buffer and deliver after quiet hours) or "drop" (silently discard)
    action: hold

  telegram:
    enabled: false
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

  discord:
    enabled: false
    bot_token: ${DISCORD_BOT_TOKEN}
    # Channel snowflake ID (e.g. 123456789012345678)
    channel_id: ${DISCORD_CHANNEL_ID:0}
    # Guild / Server ID (optional)
    guild_id: ${DISCORD_GUILD_ID:0}

storage:
  backend: ${STORAGE_BACKEND:local}
  # Delete clips older than X days (0 to disable)
  retention_days: 30
