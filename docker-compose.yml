name: argus

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: argus-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://argus-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@argus-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      CLUSTER_ID: argus-kafka-kraft-cluster-01
    volumes:
      - argus-kafka-data:/var/lib/kafka/data
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  argus:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: argus-core
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./argus/dashboard:/app/argus/dashboard:ro
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    networks:
      - argus-net
    depends_on:
      - argus-db
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  argus-db:
    image: postgres:16-alpine
    container_name: argus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-argus_secret}
    volumes:
      - argus-db-data:/var/lib/postgresql/data
    networks:
      - argus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 10s
      timeout: 5s
      retries: 5

  argus-redis:
    image: redis:7-alpine
    container_name: argus-redis
    restart: unless-stopped
    networks:
      - argus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  argus-db-data:

networks:
  argus-net:
    driver: bridge
