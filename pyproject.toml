[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-security"
version = "0.1.0"
description = "AI-Powered Smart Security System"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
keywords = ["security", "ai", "camera", "surveillance", "face-recognition", "yolo", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "opencv-python-headless>=4.9.0",
  "ultralytics>=8.2.0",
  "insightface>=0.7.3",
  "numpy>=1.26.0",
  "streamlit>=1.35.0",
  "python-telegram-bot>=21.0",
  "ollama>=0.2.0",
  "openai>=1.30.0",
  "anthropic>=0.28.0",
  "google-generativeai>=0.6.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.2.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "pillow>=10.3.0",
  "scipy>=1.13.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "onnxruntime-gpu>=1.18.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
argus = "argus.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/argus"
Repository = "https://github.com/yourusername/argus"
Issues = "https://github.com/yourusername/argus/issues"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
